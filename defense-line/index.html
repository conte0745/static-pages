        outcome: "2週間後、VPN装置経由で社内ネットワークに侵入され、ランサムウェアが展開された。",
        why: "「悪用が確認済み」の脆弱性は、待つほど攻撃を受ける確率が上がります。<b>緊急パッチは計画外でも適用</b>するのが原則です。" },
      { text: "すぐにパッチを当てる。それで完了とする", correct: false,
        outcome: "パッチは当たったが、公表前にすでに仕込まれていたバックドアが残っていた。攻撃者は入り続けた。",
        why: "悪用済みの脆弱性では、<b>パッチ適用前に侵入されている可能性</b>があります。過去にも、パッチ後もバックドアが残っていた事例が報告されています。" },
      { text: "VPNのパスワードを全員変更させる", correct: false,
        outcome: "認証前に攻撃できる脆弱性なので、パスワード変更は全く効果がなかった。",
        why: "「認証前（Pre-auth）」の脆弱性は、パスワードに関係なく攻撃されます。脆弱性の性質を読み取ることが大切です。" },
      { text: "即時にパッチ適用（できなければメーカーの緩和策や一時停止）し、メーカー提供の手順で侵害痕跡も調査する", correct: true,
        outcome: "調査の結果、侵入の痕跡は見つからなかった。公表から24時間以内に対処を完了できた。",
        why: "<b>修正 + 侵害有無の調査</b>がセットです。パッチがすぐ出ない場合は緩和策や一時的な公開停止で攻撃面を減らします。" }
    ]
  },
  {
    title: "漏えいのおそれと報告",
    situation: "最初のステージで侵害された管理者アカウントで、会員情報のCSVがエクスポートされた形跡が見つかった。氏名・メールアドレスなど約800人分。不正アクセスによるものだ。全容の解明にはまだ数週間かかりそうだ。",
    log: `<span class="r">[FOUND]</span> export_csv  rows=812  by=ops_tanaka (compromised)
<span class="y">[INFO]</span>  原因・範囲の確定見込み: 数週間後`,
    choices: [
      { text: "漏えいが確定するまで、社外には何も言わない", correct: false,
        outcome: "後日、報告の遅れが問題視され、会員と社会からの信頼を大きく失った。",
        why: "個人情報保護法では、<b>漏えいの「おそれ」</b>の段階でも報告対象になり得ます。確定を待つ理由にはなりません。" },
      { text: "原因も対策もすべて解明してから、まとめて報告する", correct: false,
        outcome: "数週間後に報告したが、「速やかな報告」がなされていないと指摘を受けた。",
        why: "報告は、発覚後に速やかに行う<b>速報</b>と、後日の<b>確報</b>の二段階です。全部分かってからでは遅すぎます。" },
      { text: "800人程度なので報告対象ではない", correct: false,
        outcome: "不正アクセスによる漏えいは人数に関係なく報告対象だった。法令違反を指摘された。",
        why: "「1,000人超」は報告対象の要件の一つにすぎません。<b>不正の目的によるおそれ</b>がある漏えいは、1人でも報告対象です。" },
      { text: "分かっている範囲で個人情報保護委員会へ速やかに速報し、本人通知の準備を進める。調査を続けて確報する", correct: true,
        outcome: "速報を提出し、会員へ通知とパスワード再設定の案内を行った。誠実な対応が評価され、混乱は最小限に抑えられた。",
        why: "個人情報保護委員会は、発覚したらまず速やかな報告を求めています。不正目的のおそれがある場合、確報は発覚日から<b>60日以内</b>。並行して<b>本人への通知</b>も必要です。警察やIPAへの相談も検討します。" }
    ]
  }
];

const app = document.getElementById('app');
const prog = document.getElementById('progress');
let stage = 0, misses = 0, attempts = 0, order = [];

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(n){const a=[...Array(n).keys()];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function renderProgress(){
  prog.innerHTML = STAGES.map((_,i)=>`<i class="${i<stage?'done':i===stage?'now':''}"></i>`).join('');
}

function title(){
  stage = 0; misses = 0; attempts = 0;
  prog.innerHTML = STAGES.map(()=>'<i></i>').join('');
  app.innerHTML = `
  <div class="card fade">
    <div class="kicker">SECURITY INCIDENT SIMULATION</div>
    <h1>海外からの<br>不正アクセスを防げ</h1>
    <p class="lead">あなたは会員制Webサービスのセキュリティ担当者。次々に起こる事態に、4つの選択肢から最善の一手を選んでください。</p>
    <p class="lead">正しい判断なら次のステージへ。判断を誤ると防衛線は突破され、そのステージからやり直しです。全${STAGES.length}ステージ。</p>
    <div class="btns"><button class="btn" id="start">ミッション開始</button></div>
  </div>`;
  document.getElementById('start').onclick = play;
}

function play(){
  renderProgress();
  const s = STAGES[stage];
  order = shuffle(s.choices.length);
  app.innerHTML = `
  <div class="card fade">
    <div class="kicker">STAGE ${stage+1} / ${STAGES.length}</div>
    <h2>${s.title}</h2>
    <p>${s.situation}</p>
    <div class="log">${s.log}</div>
    <div class="kicker">あなたの判断は？</div>
    <div class="choices">
      ${order.map((ci,i)=>`<button class="choice" data-c="${ci}"><span class="k">${'ABCD'[i]}</span><span>${esc(s.choices[ci].text)}</span></button>`).join('')}
    </div>
  </div>`;
  app.querySelectorAll('.choice').forEach(b => b.onclick = () => answer(+b.dataset.c));
  window.scrollTo({top:0,behavior:'smooth'});
}

function answer(ci){
  attempts++;
  const s = STAGES[stage], c = s.choices[ci];
  if(!c.correct) misses++;
  const last = stage === STAGES.length-1;
  app.innerHTML = `
  <div class="card fade ${c.correct?'':'shake'}">
    <span class="badge ${c.correct?'ok':'ng'}">${c.correct?'DEFENDED — 防衛成功':'BREACHED — 防げませんでした'}</span>
    <div class="picked">あなたの選択：${esc(c.text)}</div>
    <h2>${c.correct?'結果':'何が起きたか'}</h2>
    <p class="outcome">${c.outcome}</p>
    <div class="why"><b>解説：</b>${c.why}</div>
    <div class="btns">
      ${c.correct
        ? `<button class="btn" id="next">${last?'結果を見る':'次のステージへ'}</button>`
        : `<button class="btn" id="retry">もう一度やってみる</button><button class="btn ghost" id="restart">最初から</button>`}
    </div>
  </div>`;
  if(c.correct){
    document.getElementById('next').onclick = () => { stage++; last ? clear() : play(); };
  }else{
    document.getElementById('retry').onclick = play;
    document.getElementById('restart').onclick = title;
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

function clear(){
  prog.innerHTML = STAGES.map(()=>'<i class="done"></i>').join('');
  const rank = misses===0?'S — 完璧な防衛':misses<=2?'A — 頼れる守り手':misses<=5?'B — 経験を積もう':'C — 伸びしろあり';
  app.innerHTML = `
  <div class="card fade">
    <span class="badge ok">MISSION COMPLETE</span>
    <h1>全ステージ防衛成功</h1>
    <div class="stats">
      <div class="stat"><b>${STAGES.length}</b><small>クリアしたステージ</small></div>
      <div class="stat"><b>${misses}</b><small>突破された回数</small></div>
      <div class="stat"><b>${rank.split(' ')[0]}</b><small>ランク</small></div>
    </div>
    <p>${rank.split('— ')[1]}。今回の要点：</p>
    <ul class="recap">
      <li>リスト型攻撃では「失敗」より「成功したログイン」を探す</li>
      <li>侵害時は 封じ込め → 証拠保全 → 影響調査 の順。セッションの失効も忘れずに</li>
      <li>パスワードの定期変更より、多要素認証と漏えい済みパスワードの拒否</li>
      <li>海外IP遮断は抜け道のある補助策。多層防御で組み合わせる</li>
      <li>MFA通過後も、ありえない移動などの異常検知で守る</li>
      <li>悪用済み脆弱性は 即時修正 + 侵害痕跡の調査</li>
      <li>漏えいの「おそれ」でも速やかに速報、本人通知も</li>
    </ul>
    <div class="btns"><button class="btn" id="again">もう一度プレイ</button></div>
  </div>`;
  document.getElementById('again').onclick = title;
}

title();
</script>
</body>
</html>
